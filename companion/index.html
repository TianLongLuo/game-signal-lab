<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#211e2e" />
    <title>GAME Signal Lab · 相伴</title>
    <meta
      name="description"
      content="Create an adult AI character and write a private fictional story together. 创建成年虚拟角色，一起续写私有故事。"
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/companion/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="light"></div>
      <div class="window"></div>
      <div class="horizon"></div>
      <svg
        class="ambient-svg"
        viewBox="0 0 1440 900"
        preserveAspectRatio="xMidYMid slice"
        focusable="false"
      >
        <defs>
          <linearGradient id="ambient-light" x2="1" y2="1">
            <stop stop-color="#cbb3bf" stop-opacity="0.08" />
            <stop offset="1" stop-color="#b1bbc8" stop-opacity="0" />
          </linearGradient>
        </defs>
        <g class="ambient-orbit">
          <path
            d="M250 830 Q680 100 1510 280"
            fill="none"
            stroke="#cbb3bf"
            stroke-opacity="0.13"
          />
          <path
            d="M390 970 Q700 90 1530 390 L1530 900Z"
            fill="url(#ambient-light)"
          />
        </g>
        <g class="ambient-dust" fill="#ede8f0" opacity="0.25">
          <circle cx="760" cy="370" r="1.4" />
          <circle cx="1080" cy="530" r="1" />
          <circle cx="880" cy="250" r="1.8" />
          <circle cx="640" cy="650" r="1" />
          <circle cx="1250" cy="160" r="1.2" />
        </g>
      </svg>
    </div>
    <header class="topbar">
      <a class="brand" href="/companion/" aria-label="GAME"
        >GAME<span class="brand-flower">✳</span></a
      >
      <nav aria-label="主导航 / Navigation">
        <button data-tab="together" class="active" data-i18n="together">
          相伴</button
        ><button data-tab="memories" data-i18n="memories">回忆</button
        ><button data-tab="world" data-i18n="world">世界</button>
      </nav>
      <div class="tools">
        <button id="language" aria-label="Switch language">EN</button
        ><button id="settings" data-i18n="settings">设置</button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="privacy-link">
      <a href="/companion/privacy/">隐私说明 / Privacy</a>
    </footer>
    <div id="notice" role="status" aria-live="polite"></div>
    <dialog id="modal">
      <div class="modal-heading">
        <span id="modal-title"></span
        ><button id="close-modal" aria-label="关闭 / Close">×</button>
      </div>
      <div id="modal-content"></div>
    </dialog>
    <template id="composer"
      ><div class="composer">
        <textarea id="message" rows="2" maxlength="4000"></textarea>
        <div class="composer-controls">
          <button id="record"></button
          ><span id="voice-status" role="status"></span
          ><button id="cancel-voice" hidden></button
          ><button class="primary" id="send"></button>
        </div>
        <p class="fine" id="voice-hint"></p></div
    ></template>
    <script type="module" src="/companion/app.js"></script>
  </body>
</html>
