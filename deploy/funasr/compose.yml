services:
  funasr:
    build:
      context: .
      args:
        FUNASR_VERSION: "${FUNASR_VERSION:-1.4.0}"
    image: game-signal-lab/funasr:1.4.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FUNASR_HOST_PORT:-8000}:8000"
    environment:
      FUNASR_DEVICE: "${FUNASR_DEVICE:-cpu}"
      FUNASR_MODEL: "${FUNASR_MODEL:-sensevoice}"
      FUNASR_HUB: "${FUNASR_HUB:-ms}"
    volumes:
      - funasr-cache:/root/.cache
    shm_size: "2gb"
    security_opt:
      - no-new-privileges:true

volumes:
  funasr-cache:
