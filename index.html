    <noscript>
      <main>
        <h1>GAME Signal Lab｜把关系信号整理成可复盘的观察</h1>
        <p>从一个故事开始，把关系里的困惑慢慢说清楚。</p>
        <h2>这是什么工具？</h2>
        <p>GAME Signal Lab 是面向成年人的本地优先关系记录与信号分析工具。你可以匿名记录关系事件，把「发生了什么」与「我猜测什么」分开，理解带不确定性的互动信号，并依据真实反馈复盘。</p>
        <h2>核心功能</h2>
        <ul>
          <li>关系事件日记：记录事实、解释、感受与回应</li>
          <li>信号分析：区分证据强弱与行动策略</li>
          <li>行动复盘：用真实结果修正原来的判断</li>
          <li>尊重边界：明确拒绝与不舒服优先于任何信号推断</li>
        </ul>
        <h2>隐私</h2>
        <p>你的关系记录默认只保存在当前浏览器的本地存储中，不会被自动上传。只有在你明确同意并主动使用时，才会连接账号与 AI 服务。</p>
        <p>本应用需要 JavaScript 才能在浏览器本地完成记录和分析。</p>
      </main>
    </noscript>
