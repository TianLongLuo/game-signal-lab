<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GAME Signal Lab：帮助成年人记录关系事件、区分事实与猜测、理解互动信号并完成复盘。"
    />
    <meta name="theme-color" content="#182036" />
    <title>GAME · Signal Lab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23182036'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23aee8d0'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23566ff2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <div class="app-shell" id="app-shell" aria-hidden="true">
      <aside class="sidebar" aria-label="主导航">
        <button class="brand" data-view="dashboard" aria-label="返回首页">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="brand-copy">
            <strong>GAME</strong>
            <small>Signal Lab</small>
          </span>
        </button>

        <nav class="nav-list">
          <button class="nav-item is-active" data-view="dashboard">
            <span class="nav-icon" aria-hidden="true">⌂</span>
            <span>今日概览</span>
          </button>
          <button class="nav-item" data-view="new-event">
            <span class="nav-icon" aria-hidden="true">＋</span>
            <span>记录事件</span>
          </button>
          <button class="nav-item" data-view="people">
            <span class="nav-icon" aria-hidden="true">◎</span>
            <span>关系档案</span>
          </button>
          <button class="nav-item" data-view="review">
            <span class="nav-icon" aria-hidden="true">↺</span>
            <span>行动复盘</span>
          </button>
          <button class="nav-item" data-view="profile">
            <span class="nav-icon" aria-hidden="true">◇</span>
            <span>我的表达</span>
          </button>
        </nav>

        <div class="sidebar-note">
          <span class="privacy-dot" aria-hidden="true"></span>
          <div>
            <strong>仅保存在本机</strong>
            <p>数据默认不上传、不追踪。</p>
          </div>
        </div>

        <button class="nav-item nav-item--subtle" data-view="privacy">
          <span class="nav-icon" aria-hidden="true">◉</span>
          <span>隐私与数据</span>
        </button>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="打开导航" aria-expanded="false">
            <span></span><span></span>
          </button>
          <div class="topbar-copy">
            <span class="eyebrow">关系事件与成长记录系统</span>
            <strong id="topbar-title">今日概览</strong>
          </div>
          <div class="topbar-actions">
            <span class="local-badge"><i></i> 本地模式</span>
            <button class="avatar-button" data-view="profile" aria-label="打开个人表达设置">
              <span id="avatar-initial">我</span>
            </button>
          </div>
        </header>

        <main id="main-content" tabindex="-1"></main>
      </div>
    </div>

    <dialog class="age-gate" id="age-gate" aria-labelledby="age-title">
      <div class="age-orbit" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p class="eyebrow">使用前确认</p>
      <h1 id="age-title">关系里的答案，<br />应该来自双方。</h1>
      <p class="age-intro">
        GAME 帮助你整理事实、理解不确定性并准备更清楚的沟通。它不会读心，也不会教你突破拒绝。
      </p>
      <div class="age-principles">
        <div><span>01</span><p>仅面向年满 18 岁的成年人</p></div>
        <div><span>02</span><p>明确表达始终高于信号推断</p></div>
        <div><span>03</span><p>尊重拒绝、边界与自由退出</p></div>
      </div>
      <label class="check-row age-check">
        <input type="checkbox" id="adult-check" />
        <span>我已年满 18 岁，并理解分析只作参考。</span>
      </label>
      <button class="button button--primary button--full" id="enter-app" disabled>
        进入 Signal Lab
        <span aria-hidden="true">→</span>
      </button>
      <p class="microcopy">如遇暴力、胁迫、跟踪或严重心理困扰，请优先寻求现实中的专业支持。</p>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <template id="icon-template">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
