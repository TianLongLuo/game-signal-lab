<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GAME Signal Lab 帮助成年人记录关系事件、区分事实与猜测，并形成尊重边界、可以复盘的下一步沟通。"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="GAME Signal Lab" />
    <meta
      property="og:title"
      content="GAME Signal Lab｜把关系信号整理成可复盘的观察"
    />
    <meta
      property="og:description"
      content="记录关系事件、区分事实与猜测，形成尊重边界的下一步沟通。"
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="GAME Signal Lab｜把关系信号整理成可复盘的观察"
    />
    <meta
      name="twitter:description"
      content="记录关系事件、区分事实与猜测，形成尊重边界的下一步沟通。"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#182036" />
    <title>GAME Signal Lab｜把关系信号整理成可复盘的观察</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23182036'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23aee8d0'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23566ff2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GAME Signal Lab",
        "url": "/",
        "description": "帮助成年人记录关系事件、区分事实与猜测，并形成尊重边界、可以复盘的下一步沟通。",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any",
        "inLanguage": "zh-CN",
        "audience": {
          "@type": "Audience",
          "suggestedMinAge": 18
        }
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <div class="app-shell" id="app-shell" aria-hidden="true">
      <aside class="sidebar" id="primary-sidebar" aria-label="主导航">
        <button class="brand" data-view="dashboard" aria-label="返回首页">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="brand-copy">
            <strong>GAME</strong>
            <small>Signal Lab</small>
          </span>
        </button>

        <nav class="nav-list">
          <button class="nav-item" data-view="new-event">
            <span class="nav-icon" aria-hidden="true">＋</span>
            <span>开始记录</span>
          </button>
          <button class="nav-item" data-view="people">
            <span class="nav-icon" aria-hidden="true">◎</span>
            <span>对象档案</span>
          </button>
          <button class="nav-item" data-view="agent">
            <span class="nav-icon" aria-hidden="true">AI</span>
            <span>一起想想</span>
          </button>
        </nav>

        <div class="sidebar-note">
          <span class="privacy-dot" aria-hidden="true"></span>
          <div>
            <strong>你的故事，由你决定放在哪里</strong>
            <p>默认留在本机；同步前会再次提醒你。</p>
          </div>
        </div>

      </aside>
      <button class="sidebar-scrim" id="sidebar-scrim" aria-label="关闭导航" hidden></button>

      <div class="workspace">
        <header class="topbar">
          <button
            class="mobile-menu"
            id="mobile-menu"
            aria-label="打开导航"
            aria-controls="primary-sidebar"
            aria-expanded="false"
          >
            <span></span><span></span>
          </button>
          <div class="topbar-copy">
            <span class="eyebrow">一间只属于你的关系工作室</span>
            <strong id="topbar-title">今日概览</strong>
          </div>
          <div class="topbar-actions">
            <button class="local-badge" id="platform-status" data-view="agent">
              <i aria-hidden="true"></i>
              本地模式
            </button>
            <button class="avatar-button" data-view="profile" aria-label="打开个人表达设置">
              <span id="avatar-initial">我</span>
            </button>
          </div>
        </header>

        <main id="main-content" tabindex="-1"></main>
      </div>
    </div>

    <dialog class="age-gate" id="age-gate" aria-labelledby="age-title">
      <div class="age-orbit" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p class="eyebrow">使用前确认</p>
      <h1 id="age-title">关系里的答案，<br />应该来自双方。</h1>
      <p class="age-intro">
        GAME 像一张安静的桌子，帮你把发生过的事、心里的感受和还不确定的部分放在一起看。它不会读心，也不会教你突破拒绝。
      </p>
      <div class="age-principles">
        <div><span>01</span><p>仅面向年满 18 岁的成年人</p></div>
        <div><span>02</span><p>明确表达始终高于信号推断</p></div>
        <div><span>03</span><p>尊重拒绝、边界与自由退出</p></div>
      </div>
      <label class="check-row age-check">
        <input type="checkbox" id="adult-check" />
        <span>我已年满 18 岁，并理解分析只作参考。</span>
      </label>
      <button class="button button--primary button--full" id="enter-app" disabled>
        进入 Signal Lab
        <span aria-hidden="true">→</span>
      </button>
      <p class="microcopy">如遇暴力、胁迫、跟踪或严重心理困扰，请优先寻求现实中的专业支持。</p>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
      <main>
        <h1>GAME Signal Lab</h1>
        <p>从一个故事开始，把关系里的困惑慢慢说清楚。</p>
        <p>本应用需要 JavaScript 才能在浏览器本地完成记录和分析。</p>
      </main>
    </noscript>

    <template id="icon-template">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </template>

    <script src="./runtime-config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
