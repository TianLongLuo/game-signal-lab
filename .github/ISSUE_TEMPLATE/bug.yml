name: Bug report
description: Report a reproducible GAME Signal Lab defect using fictional data only.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real chats, names, account handles, contact details, locations, exports, or third-party personal data.**
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened? Use fictional examples.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest safe reproduction.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact area
      options:
        - Safety or consent
        - Privacy or data loss
        - Accessibility
        - Rules or analysis
        - Import/export
        - Visual or interaction
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used only fictional data and removed all personal information.
          required: true
